[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theheight0-mlopsarch_jd165"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对MLOps 平台架构师·量化位宽与精度回退相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "theheight0" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://theheight0.github.io"
Repository = "https://github.com/theheight0/mlopsarch_jd165"
Issues = "https://github.com/theheight0/mlopsarch_jd165/issues"

[project.scripts]
mlopsarch_jd165 = "mlopsarch_jd165:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd165"]
